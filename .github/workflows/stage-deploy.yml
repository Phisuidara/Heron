name: Deploy stage preview to Cloudflare Pages

on:
  push:
    branches: [stage]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The stage build has no fixed base path on Cloudflare Pages, unlike the
      # GitHub Pages production build, so override `base` for this deploy only.
      - name: Build (no base path)
        run: pnpm exec astro build --base /

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: heron-stage
          directory: dist
          branch: stage
